service {
	proto-fd-max 15000
	cluster-name flue-aerospike-test
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		access-address 127.0.0.1
		port 3200
	}

	heartbeat {
		mode mesh
		port 3202
	}

	fabric {
		port 3201
	}

	admin {
		address any
		port 3203
	}
}

namespace test {
	replication-factor 1
	default-ttl 0
	strong-consistency true
	index-stage-size 128M
	sindex-stage-size 128M

	storage-engine memory {
		data-size 512M
	}
}
